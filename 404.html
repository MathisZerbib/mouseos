<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#09090d">
<title>Not found · MouseOS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<style>
/* The page a wrong address lands on, in the art direction of the landing: a giant 404 behind (its zero in orange),
   the phone in 3D in front, keys and a status floating around, and the orange cursor looking for its way.
   One file serves every language: the script below reads the language from the address (/fr/…), else from the browser. */
@font-face{font-family:"Mona Sans";font-weight:700;font-stretch:112%;src:url(/fonts/mona-sans-display.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Mona Sans Digits";font-weight:800;font-stretch:112%;src:url(/fonts/mona-sans-digits.woff2) format("woff2");font-display:swap}
:root{--page:#09090d;--ink:#f5f1ea;--soft:#b9b3aa;--signal:#ff4d00;--rim:rgba(255,255,255,.12);--ok:#2fc868}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--page);color:var(--soft);overflow-x:hidden;
  background-image:radial-gradient(70% 46% at 50% 108%,rgba(255,90,20,.3),transparent 70%);background-repeat:no-repeat;background-attachment:fixed;
  font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
header{padding:26px 32px;position:relative;z-index:3}
.logo{font:700 20px/1 "Mona Sans",system-ui,sans-serif;font-stretch:112%;letter-spacing:.01em;color:var(--ink);text-decoration:none}
.logo b{color:var(--signal)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px 64px}

/* The stage, as on the landing: a giant word behind, the phone in front, a few things floating around. */
.stage{position:relative;width:100%;max-width:1100px;display:grid;place-items:center;font-size:var(--s);user-select:none;-webkit-user-select:none}
.big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;white-space:nowrap;line-height:.8;color:rgba(245,241,234,.085);animation:big 1s cubic-bezier(.2,.8,.2,1) both}
.big b{color:var(--signal);font-weight:inherit}
.chip{position:absolute;z-index:2;font-size:max(.07em,11px);animation:pop .6s cubic-bezier(.3,1.5,.5,1) both,bob 6s ease-in-out infinite}
.chip>span{display:grid;place-items:center;height:2.4em;min-width:2.4em;padding:0 .62em;border-radius:.66em;transform:rotate(var(--r,0deg));
  background:linear-gradient(145deg,#25262f,#15161b);border:1px solid var(--rim);box-shadow:0 1.1em 2em -.7em rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.08) inset;
  color:var(--ink);font-weight:650;font-size:1em;line-height:1;white-space:nowrap}
.chip.pill>span{display:flex;gap:.55em;height:auto;padding:.72em 1.05em;border-radius:.8em;font-size:.56em}
.chip.pill i{width:.6em;height:.6em;border-radius:50%;background:var(--dot,var(--signal));box-shadow:0 0 0 .28em color-mix(in srgb,var(--dot,var(--signal)) 25%,transparent)}
.chip.hot>span{background:linear-gradient(145deg,#ff7a3d,#ff4d00);border-color:rgba(255,255,255,.3);color:#fff}
.dot{position:absolute;z-index:2;width:.05em;height:.05em;min-width:14px;min-height:14px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 .022em rgba(255,77,0,.25);animation:pulse 2.4s ease-in-out infinite}

/* The phone, in volume: a front, a back, and a stack of slices between them that makes the metal band. */
/* the fade-in sits on the scene, never on the phone: an animated opacity would flatten its volume */
.scene{position:relative;perspective:1000px;animation:float 5s ease-in-out infinite,appear .5s ease-out both}
@keyframes appear{from{opacity:0}}
.lean,.flip{display:block;transform-style:preserve-3d}
.lean{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s ease-out}
.flip{transform:rotateY(var(--f,0deg));transition:transform 1s cubic-bezier(.3,.9,.3,1)}
.ph{display:block;position:relative;width:var(--pw);aspect-ratio:540/1150;transform-style:preserve-3d;--t:calc(var(--pw)*.15)}
.ph>*{position:absolute;inset:0;border-radius:calc(var(--pw)*.155)}
/* brushed titanium: light along the top and one side, darker toward the other */
.ph .sl{transform:translateZ(calc(var(--t)*var(--k)));
  background:linear-gradient(100deg,#8d929d,#4a4e58 12%,#2b2e36 50%,#565a65 88%,#a3a8b3);box-shadow:0 0 0 1px rgba(255,255,255,.07) inset}
/* the buttons on the edges: thin plates standing out of the band */
.ph .bt{inset:auto;left:100%;top:var(--y);width:calc(var(--t)*.5);height:var(--h);border-radius:calc(var(--pw)*.012);
  transform-origin:0 50%;transform:translateZ(calc(var(--t)*.25)) rotateY(90deg) translateZ(calc(var(--pw)*.012));background:linear-gradient(#9a9faa,#454954)}
.ph .bt.l{left:auto;right:100%;transform-origin:100% 50%;transform:translateZ(calc(var(--t)*.25)) rotateY(-90deg) translateZ(calc(var(--pw)*.012))}
.ph .bt::after{content:"";position:absolute;inset:0;border-radius:inherit;background:#6c717c;transform:rotateY(90deg) translateZ(calc(var(--pw)*.006))}
.ph .front{background:#050608;padding:calc(var(--pw)*.034);transform:translateZ(calc(var(--t)/2 + 1px));backface-visibility:hidden;
  box-shadow:0 0 0 calc(var(--pw)*.012) #7d828d inset,0 0 0 calc(var(--pw)*.02) #17181d inset}
.ph .front::after{content:"";position:absolute;top:calc(var(--pw)*.056);left:50%;width:25%;height:calc(var(--pw)*.064);transform:translateX(-50%);background:#000;border-radius:99px;box-shadow:0 0 0 1px rgba(255,255,255,.05)}
.ph .front::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:2;pointer-events:none;
  background:linear-gradient(112deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 26%,transparent 42%,transparent 72%,rgba(255,255,255,.07))}
.ph .scr{position:relative;display:block;width:100%;height:100%;border-radius:calc(var(--pw)*.122);overflow:hidden;background:#101116}
.ph .scr img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.ph .back{transform:rotateY(180deg) translateZ(calc(var(--t)/2 + 1px));backface-visibility:hidden;transform-style:preserve-3d;
  background:linear-gradient(150deg,#3a3e48,#17191e 55%,#262930);box-shadow:0 0 0 calc(var(--pw)*.012) #7d828d inset;display:grid;place-items:center}
/* the size of the word is set on the word itself: --pw can be in em, and must not be read against a smaller font */
.ph .back>span{font:700 calc(var(--pw)*.085)/1 "Mona Sans",system-ui,sans-serif;font-stretch:112%;letter-spacing:.02em;color:#f1f1f1}
.ph .back b{color:#ff4d00}
/* the camera block stands out of the back, its lenses out of the block */
.ph .back i{position:absolute;left:8%;top:4.5%;width:40%;aspect-ratio:1;border-radius:27%;transform:translateZ(calc(var(--t)*.14));
  background:linear-gradient(150deg,#2c2f38,#101115);box-shadow:0 0 0 1.5px #555a65 inset,0 calc(var(--pw)*.02) calc(var(--pw)*.05) rgba(0,0,0,.6)}
.ph .back i::before,.ph .back i::after{content:"";position:absolute;width:40%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#5d6b86,#0b0d12 46%,#000 62%,#2a2d35 66%,#0c0d10 72%);box-shadow:0 0 0 calc(var(--pw)*.008) #6a6f7a}
.ph .back i::before{left:9%;top:9%}.ph .back i::after{right:9%;bottom:9%}
.ground{position:absolute;left:50%;bottom:calc(var(--pw)*-.3);width:calc(var(--pw)*1.7);height:calc(var(--pw)*.3);margin-left:calc(var(--pw)*-.85);border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.8),transparent);animation:ground 5s ease-in-out infinite;pointer-events:none}
@keyframes float{50%{translate:0 calc(var(--pw)*-.07)}}
@keyframes ground{50%{transform:scale(.86);opacity:.7}}
.stage{--s:min(40vw,56vh,470px);--pw:.31em;height:.9em;margin-bottom:.07em}
.big{font:800 1em/.8 "Mona Sans Digits","Mona Sans",system-ui,sans-serif;font-stretch:112%;letter-spacing:-.02em}
.scene{cursor:pointer;-webkit-tap-highlight-color:transparent}
/* it arrives spinning, then keeps turning a little from side to side */
.ph{animation:arrive 1.5s cubic-bezier(.2,.8,.2,1) .15s both,sway 6.5s ease-in-out 1.65s infinite alternate}
@keyframes arrive{from{transform:rotateY(-400deg) rotateX(14deg) scale(.6)}to{transform:rotateY(-38deg) rotateX(9deg)}}
@keyframes sway{from{transform:rotateY(-38deg) rotateX(9deg)}to{transform:rotateY(-14deg) rotateX(3deg)}}
.c1{left:calc(50% - 15.5em);top:4%;--r:-9deg;animation-delay:.9s,0s}
.c2{left:calc(50% + 10.5em);top:0;--r:10deg;animation-delay:1.05s,-2s}
.c3{font-size:max(.07em,22px);left:calc(50% - 17em);top:64%;--r:-5deg;animation-delay:1.2s,-4s}
.dot{left:calc(50% + .86em);top:70%}
/* the orange cursor, lost: it wanders, stops, wanders again */
.cur{position:absolute;z-index:3;left:50%;top:0;width:.085em;height:.085em;min-width:28px;min-height:28px;pointer-events:none;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));animation:lost 11s cubic-bezier(.6,0,.3,1) infinite}
.cur svg{display:block;width:100%;height:100%}
@keyframes lost{
  0%,6%{transform:translate(-.78em,.5em) rotate(0)}
  22%,30%{transform:translate(-.3em,.06em) rotate(-8deg)}
  46%,54%{transform:translate(.62em,.56em) rotate(6deg)}
  70%,78%{transform:translate(.3em,.2em) rotate(-4deg)}
  100%{transform:translate(-.78em,.5em) rotate(0)}
}

h1{margin:0 0 12px;font:700 clamp(28px,4.4vw,48px)/1.05 "Mona Sans",system-ui,sans-serif;font-stretch:112%;letter-spacing:-.03em;color:var(--ink);text-wrap:balance;animation:fade .6s ease-out .5s both}
p.text{margin:0;font-size:19px;line-height:1.5;color:var(--soft);max-width:440px;animation:fade .6s ease-out .6s both}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:32px;animation:fade .6s ease-out .7s both}
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 24px;border-radius:16px;font-size:16px;font-weight:650;text-decoration:none;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s,box-shadow .2s,transform .2s}
.btn svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn:active{transform:scale(.97)}
.btn-signal{background:var(--signal);color:#fff;box-shadow:0 14px 34px -12px rgba(255,77,0,.7)}
.btn-signal:hover{background:#ff6a29}
.btn-line{color:var(--ink);background:rgba(255,255,255,.04);box-shadow:0 0 0 1px rgba(255,255,255,.2) inset}
.btn-line:hover{box-shadow:0 0 0 1px rgba(255,255,255,.5) inset}
a:focus-visible,.btn:focus-visible{outline:2px solid #ff9447;outline-offset:3px}

@keyframes big{from{opacity:0;transform:translate(-50%,-42%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes pop{from{opacity:0;scale:.4}to{opacity:1;scale:1}}
@keyframes bob{50%{translate:0 -.5em}}
@keyframes pulse{50%{box-shadow:0 0 0 .05em rgba(255,77,0,.12)}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:640px){header{padding:20px 16px}.stage{--s:min(56vw,44vh)}.c1{left:2%}.c2{left:auto;right:2%}.c3{left:0;top:84%}.dot{left:auto;right:6%}p.text{font-size:17px}.cta{flex-direction:column;align-self:stretch}}
@media (max-height:620px){.stage{--s:min(40vw,46vh)}main{padding-bottom:28px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.cur{transform:translate(.3em,.2em)}.ph{transform:rotateY(-38deg) rotateX(9deg)}}
</style>
</head>
<body>
<header><a class="logo" id="logo" href="/" aria-label="MouseOS">MOUSE<b>OS</b></a></header>
<main>
  <div class="stage" role="img" aria-label="404">
    <span class="big" aria-hidden="true">4<b>0</b>4</span>
    <span class="scene" id="zero"><span class="lean"><span class="flip"><span class="ph"><span class="back"><i></i><span>MOUSE<b>OS</b></span></span><span class="sl" style="--k:-0.440"></span><span class="sl" style="--k:-0.398"></span><span class="sl" style="--k:-0.356"></span><span class="sl" style="--k:-0.314"></span><span class="sl" style="--k:-0.272"></span><span class="sl" style="--k:-0.230"></span><span class="sl" style="--k:-0.189"></span><span class="sl" style="--k:-0.147"></span><span class="sl" style="--k:-0.105"></span><span class="sl" style="--k:-0.063"></span><span class="sl" style="--k:-0.021"></span><span class="sl" style="--k:0.021"></span><span class="sl" style="--k:0.063"></span><span class="sl" style="--k:0.105"></span><span class="sl" style="--k:0.147"></span><span class="sl" style="--k:0.189"></span><span class="sl" style="--k:0.230"></span><span class="sl" style="--k:0.272"></span><span class="sl" style="--k:0.314"></span><span class="sl" style="--k:0.356"></span><span class="sl" style="--k:0.398"></span><span class="sl" style="--k:0.440"></span><span class="bt" style="--y:27%;--h:13%"></span><span class="bt l" style="--y:21%;--h:5%"></span><span class="bt l" style="--y:30%;--h:8%"></span><span class="bt l" style="--y:40%;--h:8%"></span><span class="front"><span class="scr"><img id="shot" alt="" src="/three/tex/en/pc.webp" width="540" height="1169"></span></span></span></span></span><span class="ground"></span></span>
    <span class="chip c1" aria-hidden="true"><span>esc</span></span>
    <span class="chip hot c2" aria-hidden="true"><span>?</span></span>
    <span class="chip pill c3" aria-hidden="true"><span><i></i><span id="pill">Not found</span></span></span>
    <span class="dot" aria-hidden="true"></span>
    <span class="cur" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 2.5 20 11l-7 1.8L10 20z" fill="#ff4d00" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg></span>
  </div>
  <h1 id="title">The cursor got lost.</h1>
  <p class="text" id="text">This page doesn't exist, or no longer does.</p>
  <div class="cta">
    <a class="btn btn-signal" id="home" href="/"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span id="home-t">Back to MouseOS</span></a>
    <a class="btn btn-line" id="get" href="/#telecharger"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span id="get-t">Download</span></a>
  </div>
</main>
<script>
(function(){
var W={
en:["The cursor got lost.","This page doesn't exist, or no longer does.","Back to MouseOS","Download","Not found"],
fr:["Le curseur s'est perdu.","Cette page n'existe pas, ou n'existe plus.","Retour à MouseOS","Télécharger","Page introuvable"],
de:["Der Mauszeiger hat sich verirrt.","Diese Seite gibt es nicht oder nicht mehr.","Zurück zu MouseOS","Download","Seite nicht gefunden"],
es:["El cursor se ha perdido.","Esta página no existe o ya no existe.","Volver a MouseOS","Descargar","Página no encontrada"],
it:["Il cursore si è perso.","Questa pagina non esiste, o non esiste più.","Torna a MouseOS","Scarica","Pagina non trovata"],
pt:["O cursor se perdeu.","Esta página não existe, ou não existe mais.","Voltar ao MouseOS","Baixar","Página não encontrada"],
ja:["カーソルが迷子です","このページは存在しないか、移動しました。","MouseOSに戻る","ダウンロード","ページが見つかりません"],
zh:["光标迷路了","该页面不存在，或已被移走。","返回 MouseOS","下载","未找到页面"]};
var seg=(location.pathname.split("/")[1]||"").toLowerCase(),lang=W[seg]&&seg!=="en"?seg:"";
if(!lang&&!/^[a-z]{2}$/.test(seg)){var n=(navigator.language||"en").slice(0,2).toLowerCase();if(W[n])lang=n==="en"?"":n}
var w=W[lang||"en"],base=lang?"/"+lang+"/":"/",$=function(id){return document.getElementById(id)};
document.documentElement.lang=lang||"en";document.title=w[4]+" · MouseOS";
$("title").textContent=w[0];$("text").textContent=w[1];$("home-t").textContent=w[2];$("get-t").textContent=w[3];$("pill").textContent=w[4];
$("logo").href=$("home").href=base;$("get").href=base+"#telecharger";
$("shot").src="/three/tex/"+(lang||"en")+"/pc.webp";
/* the phone leans toward the pointer, and turns once round when pressed */
var z=$("zero"),f=0;
if(matchMedia("(hover:hover) and (prefers-reduced-motion:no-preference)").matches)addEventListener("pointermove",function(e){
  var r=z.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/innerWidth,y=(e.clientY-r.top-r.height/2)/innerHeight;
  z.style.setProperty("--ry",(x*40).toFixed(1)+"deg");z.style.setProperty("--rx",(-y*30).toFixed(1)+"deg")},{passive:true});
z.addEventListener("click",function(){f+=360;z.style.setProperty("--f",f+"deg")});
})();
</script>
</body>
</html>
